name: CI

# The default run. It must be fast and it must be green, so it contains only
# suites that need nothing but a checkout: no Docker daemon, no Cloudflare
# account, no secrets. The suites that DO need those live in e2e.yml and run on
# a label or a manual dispatch (see CONTRIBUTING.md).
#
# Everything here is checked for real. There is no `continue-on-error` in this
# file, and no step that reports success without asserting something.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # ---------------------------------------------------------------- Rust ------
  # `crates/mari-core` (chunking, manifests, restore, GC), `crates/mari-proto`
  # (the wire types) and `crates/marid` (the supervisor). The unit suites run a
  # real PTY with real child processes; nothing here needs a container.
  rust:
    name: cargo (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        # rust-toolchain.toml pins the channel; rustup honours it, so this only
        # has to make sure the two components exist.
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # `--all-targets` so tests are linted too. `-D warnings` is passed to
        # clippy rather than set as a global RUSTFLAGS, deliberately: RUSTFLAGS
        # would also apply to every crates.io dependency, and a warning in
        # somebody else's crate is not this repo's failure.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The Rust↔TypeScript conformance fixtures are GENERATED by the Rust
      # suites and COMMITTED (decisions.md, "Wire protocol"). If a Rust change
      # moves the wire format, `cargo test` above rewrites them — and the
      # TypeScript mirror would then be compared against the new bytes and pass,
      # hiding the drift. So the fixtures must come out of the test run byte for
      # byte identical to what is already in the tree.
      - name: Conformance fixtures unchanged by the test run
        run: |
          if ! git diff --exit-code -- packages/shared/fixtures packages/control-plane/test/fixtures; then
            echo "::error::Rust-generated conformance fixtures drifted. Commit the regenerated files and update the mirror in packages/shared."
            exit 1
          fi

  # ------------------------------------------------------------ TypeScript ----
  # `@mari/shared` (protocol mirror), `@mari/control-plane` (Hono app + Durable
  # Objects against REAL bindings via @cloudflare/vitest-pool-workers), and
  # `@mari/web` (unit + component suites). The Node-runtime parity suite runs
  # here too: it needs no Docker, only node:sqlite.
  node:
    name: pnpm (typecheck, test, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          # Matches deploy/Dockerfile.control-plane, so the bundle this job
          # builds is the bundle a private instance runs.
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Node control-plane parity suite
        # Same ComputerDO/EventsDO classes as the Workers entry, with
        # packages/control-plane/src/node/ supplying the platform. Ungated: the
        # Docker part of that lane is MARI_NODE_E2E=1 and lives in e2e.yml.
        run: pnpm --filter @mari/control-plane test:node

      - name: The private instance bundles
        # This is the step that catches "the repo typechecks but `deploy/up.sh`
        # cannot build an image": esbuild resolves `cloudflare:workers` to the
        # Node base class and bundles the whole control plane into one file.
        run: |
          pnpm --filter @mari/control-plane build:node
          test -s packages/control-plane/dist/node.mjs

      - name: The web app builds
        run: pnpm --filter @mari/web exec vite build

# The Playwright web suite is NOT here, and that is a defect, not a preference.
# It shares ONE control plane across all its spec files with `workers: 1`, and
# `editor-save.spec.ts` performs a spec 8.4 file write, which WAKES the seeded
# computer. Every later spec that needs a COLD card
# (`[data-testid="computer-card"][data-state="cold"]`) then waits for the tier
# policy to put it back — measured at 30 s for one such spec, and past the 45 s
# test timeout in a full run. Each file passes on its own. Until the suite states
# its own precondition (re-seed, or its own computer per file) it belongs in
# e2e.yml, where a slow run is expected and a red run is read rather than
# ignored. See CONTRIBUTING.md, "The web Playwright suite".
